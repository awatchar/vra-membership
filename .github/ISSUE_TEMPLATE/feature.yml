name: Feature
description: Propose a scoped product or engineering capability.
title: "[Feature] "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: Do not include real PII, credentials, ID-card images, payment slips, or production provider responses.
  - type: input
    id: parent
    attributes:
      label: Parent / dependency Issues
      description: Link the parent epic and blocking Issues, for example #1.
      placeholder: "Refs #1"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the user or operational outcome, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what this Issue includes and explicitly excludes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable result"
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Describe data, trust-boundary, authorization, payment, logging, and retention impact. Say “None” with a reason if applicable.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Verification plan
      description: List automated and manual checks using synthetic data only.
    validations:
      required: true
  - type: input
    id: paths
    attributes:
      label: Intended path ownership
      description: Paths the assignee/agent expects to edit so parallel work can avoid overlap.
      placeholder: "src/payment/**, tests/payment/**"
    validations:
      required: true
